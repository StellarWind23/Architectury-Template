modLoader = "javafml"
loaderVersion = "[2,)"

[[mods]]
modId = "${modid}"
displayName = "${mod_name}"
version = "${mod_version}"
authors = "${author}"
description = "${description}"
issueTrackerURL = "${issues_url}"
license = "${license}"
logoFile = "./assets/${modid}/${modid}.png"

[[dependencies.${modid}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "architectury"
type = "required"
versionRange = "[${architectury_api_version},)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "${modid}.mixins.json"
